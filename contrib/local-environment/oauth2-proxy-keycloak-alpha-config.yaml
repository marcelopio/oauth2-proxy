server:
  bindAddress: "0.0.0.0:4180"

upstreamConfig:
  upstreams:
    - id: httpbin
      path: /
      uri: http://httpbin

injectRequestHeaders:
  - name: X-Forwarded-User
    values:
      - claimSource:
          claim: user
  - name: X-Forwarded-Email
    values:
      - claimSource:
          claim: email
  - name: X-Forwarded-Access-Token
    values:
      - claimSource:
          claim: access_token

providers:
  - id: keycloak
    provider: keycloak-oidc
    clientID: oauth2-proxy
    clientSecret: 72341b6d-7065-4518-a0e4-50ee15025608
    oidcConfig:
      issuerURL: http://keycloak.localtest.me:9080/realms/oauth2-proxy
    keycloakConfig:
      useRPTToken: true
